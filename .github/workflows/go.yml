name: Go

on:
  push:
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
      id: go

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -race -v ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.15.0
